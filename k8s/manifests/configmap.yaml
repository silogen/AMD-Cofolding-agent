apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-agentic-config
data:
  REINVENT4_AGENT_BACKEND: openai
  # The interactive agent and the supervisors share the throughput tier: both
  # are "many turns, nobody waiting on any one of them". The conductor has its
  # own keys below, because a person *is* waiting on its turns.
  REINVENT4_AGENT_MODEL: "Qwen/Qwen3-32B-FP8"
  REINVENT4_AGENT_BASE_URL: http://dd-agentic-aim-supervisor/v1
  # The conductor tier: a bigger model on a latency profile. Separate keys
  # rather than a separate ConfigMap so one `kubectl get configmap` still
  # shows which model each tier is on.
  CONDUCTOR_AGENT_MODEL: "openai/gpt-oss-120b"
  CONDUCTOR_AGENT_BASE_URL: http://dd-agentic-aim-conductor/v1
  REINVENT4_AGENT_NO_VERIFY_SSL: "false"
  REINVENT4_AGENT_MULTI_AGENT: "true"
  REINVENT4_AGENT_LOG_DIR: /logs
  reinvent4_mcp_config.yaml: |
    reinvent:
      device: "cuda:0"
      batch_size: 16
      sigma: 128
      learning_rate: 0.0001
      unique_sequences: true
      randomize_smiles: true
      default_model: ".reinvent"
      diversity_filter:
        type: "IdenticalMurckoScaffold"
        bucket_size: 25
        minscore: 0.4

    # Each scorer is its own Deployment behind a ClusterIP Service, so the
    # URLs below are cluster DNS, not the loopback addresses a single
    # multi-container pod used. Names are unqualified, so they resolve in
    # whichever namespace apply.sh --namespace deploys into.
    scoring:
      aggregation: "geometric_mean"
      pre_scoring:
        enabled: true
        components:
          qed: true
          molecular_weight: true
          hbond_donors: true
          hbond_acceptors: true
          slogp: true
          num_rot_bond: true
      boltz:
        enabled: true
        # The gateway, not the replicas: it places each batch on an idle one.
        # dd-agentic-boltz is headless and is what the gateway resolves.
        service_url: "http://dd-agentic-boltz-gateway:8091/score"
        recycling_steps: 3
        diffusion_samples: 1
        sampling_steps_affinity: 200
        affinity_mode: "pred_value"
        cache_dir: "/cache"
        use_msa_server: false
        msa_server_url: "https://api.colabfold.com"
      posebusters:
        enabled: true
        service_url: "http://dd-agentic-posebusters:8082/score"
        mode: "dock"
      admet:
        enabled: true
        service_url: "http://dd-agentic-admet:8084/score"
      retrodmta:
        enabled: true
        service_url: "http://dd-agentic-retrodmta:8085/score"
        method: "ensemble"
        window: "latest"
      interaction_profiler:
        enabled: true
        service_url: "http://dd-agentic-interaction-profiler:8083/score"
        interaction_type: "all"
        radius: 8.0
        ph: 7.4

    jobs:
      working_dir: "/data/reinvent4_mcp/jobs"
      # Several RL jobs per runner GPU: a step is mostly spent waiting on the
      # scoring call, so memory is the limit rather than compute. Raise only on
      # measured headroom -- a job was measured using 1528 MiB of the MI300X's
      # 196 GB, so the ceiling here is the supervisor count, not the GPU.
      #
      # Must be at least the campaign's concurrency, or the surplus
      # supervisors have their tasks refused with "Maximum concurrent jobs
      # (N) already active" and burn their retries doing it.
      max_concurrent_jobs: 3
      checkpoint_on_stop: true

    # Not optional in this deployment: dd-agent:local is CPU-only and carries no
    # REINVENT4, so jobs, in-process scoring and the registries all have to come
    # from the runner.
    runner:
      enabled: true
      base_url: "http://dd-agentic-reinvent-runner:8086"

    ttp:
      storage_dir: "/root/.reinvent4_mcp/ttps"

    logging:
      level: "info"
      tb_logdir: "/data/reinvent4_mcp/tb_logs"
      log_dir: "/data/reinvent4_mcp/logs"
