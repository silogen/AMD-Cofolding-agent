apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: dd-agentic-aim
spec:
  # Replace model.name with the AIMClusterModel on the target cluster:
  #   kubectl get aimclustermodel | grep -i qwen3-32b
  # AIMService.spec.model.name is the cluster object name (e.g.
  # amdenterpriseai-aim-qwen-qwen3-32b-0-13-0-...), not a short alias.
  model:
    name: amdenterpriseai-aim-qwen-qwen3-32b-0-13-0-31bb0f
  # profileOverrides require a named profile; name and selector are mutually
  # exclusive. This is the 1-GPU fp8 latency profile (interactive Driver/Reviewer
  # turns). Qwen3-32B is natively 32768 tokens; YaRN factor 2.0 extends it to
  # 65536. vLLM 0.23 takes that scaling through hf-overrides, not rope-scaling.
  profile:
    name: amdenterpriseai-aim-qwen-q-vllm-mi300x-fp8-tp1-latency-5fa2c14c
  profileOverrides:
    engineArgs:
      max-model-len: 65536
      hf-overrides: '{"rope_parameters":{"rope_theta":1000000,"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}}'
  replicas: 1
  caching:
    mode: Shared
---
# AIM Engine creates a generated KServe Service name. This stable Service
# selects the same predictor pod so the agent can use a repeatable base URL.
apiVersion: v1
kind: Service
metadata:
  name: dd-agentic-aim
spec:
  selector:
    aim.eai.amd.com/service.name: dd-agentic-aim
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
