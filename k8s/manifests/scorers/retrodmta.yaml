apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-agentic-retrodmta
  labels:
    app.kubernetes.io/name: dd-agentic-retrodmta
    app.kubernetes.io/component: scorer
spec:
  # CPU only, no /shared mount: the request carries the SMILES and the
  # response carries the scores, so nothing is handed over by path.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dd-agentic-retrodmta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dd-agentic-retrodmta
        app.kubernetes.io/component: scorer
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: retrodmta-predictor
          image: retrodmta-predictor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: retro-http
              containerPort: 8085
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: retro-http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: retro-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: retro-http
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dd-agentic-retrodmta
  labels:
    app.kubernetes.io/name: dd-agentic-retrodmta
    app.kubernetes.io/component: scorer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dd-agentic-retrodmta
  ports:
    - name: retro-http
      port: 8085
      targetPort: retro-http
