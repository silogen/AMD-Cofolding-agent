apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-agentic-admet
  labels:
    app.kubernetes.io/name: dd-agentic-admet
    app.kubernetes.io/component: scorer
spec:
  # CPU only, no /shared mount: the request carries the SMILES and the
  # response carries the scores, so nothing is handed over by path. That also
  # makes replicas free of coordination -- a plain ClusterIP round-robin is
  # enough, unlike Boltz which needs the proxy to place batches.
  #
  # Three, because this is the one scorer a TTP calls more than once per step:
  # one call per ADMET objective. At six concurrent jobs and three endpoints a
  # single replica took 18 calls per step round and was OOMKilled eight times
  # (exit 137), which left Caco2 50% NaN, Solubility 99% and logD 99% while
  # every non-ADMET component stayed at 0%.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dd-agentic-admet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dd-agentic-admet
        app.kubernetes.io/component: scorer
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: admet-predictor
          image: admet-predictor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: admet-http
              containerPort: 8084
          env:
            # The models are multi-task, so one forward pass yields all seven
            # endpoints -- a TTP with three ADMET objectives cannot avoid
            # paying for all of them, and asking for fewer saves nothing.
            # What it can avoid is the cost of the machinery around a batch of
            # sixteen.
            #
            # The dataloader is built on every call with num_workers=8, which
            # forks eight processes that each inherit the resident models, to
            # featurize sixteen molecules. With six concurrent RL jobs each
            # calling three times per step, that is what exhausted the
            # container: OOMKilled (exit 137) fourteen times across three
            # replicas, even after the limit went from 8Gi to 32Gi. In-process
            # is both cheaper and faster at this size.
            - name: PRED_LOADER_WORKERS
              value: "0"
            # The RDKit fan-out only engages above 128 molecules (_PMIN), so
            # the pool is never built for our batches. Stated anyway, because
            # the default is min(32, cpu_count) and this node has 224 cores.
            - name: PRED_WORKERS
              value: "1"
          resources:
            # 8Gi was not a tight fit, it was an insufficient one: /score
            # predicts every endpoint for the whole batch and then returns the
            # one that was asked for, so a 16-molecule call costs all seven
            # endpoints' worth of model activations regardless. The node
            # carries 2.1 TiB at a sixth requested, so this headroom was
            # simply unclaimed.
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 32Gi
          startupProbe:
            httpGet:
              path: /health
              port: admet-http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: admet-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: admet-http
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dd-agentic-admet
  labels:
    app.kubernetes.io/name: dd-agentic-admet
    app.kubernetes.io/component: scorer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dd-agentic-admet
  ports:
    - name: admet-http
      port: 8084
      targetPort: admet-http
