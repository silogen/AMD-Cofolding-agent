apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is set by apply.sh --namespace (do not hard-code an environment here).

resources:
  - configmap.yaml
  - llm-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - aim-service.yaml
  # One Deployment + ClusterIP Service each. The ConfigMap's scoring
  # service_urls are these Service names.
  # REINVENT4 job lifecycle and scoring behind REST, so the agent needs
  # neither REINVENT4 nor a GPU once runner.enabled is set.
  - runner/reinvent-runner.yaml
  # Control-plane ledger: the queue of weight vectors, who holds which task,
  # what came back, and the Pareto front over it.
  - campaign-store/campaign-store.yaml
  # The worker pool that drains that queue. Ships at replicas: 0 -- a campaign
  # starts by scaling it to N.
  - supervisor/dd-supervisor.yaml
  # Opens campaigns, keeps N in flight, closes the books. Carries its own
  # ServiceAccount: it is the only workload that calls the Kubernetes API,
  # because scaling the pool is how concurrency is expressed.
  - conductor/dd-conductor.yaml
  - scorers/boltz.yaml
  # Least-busy placement across the M boltz replicas.
  - scorers/boltz-proxy.yaml
  # Result cache, batch coalescing and /stats in front of the proxy. This is
  # what the ConfigMap dials.
  - scorers/boltz-gateway.yaml
  - scorers/posebusters.yaml
  - scorers/interaction-profiler.yaml
  - scorers/admet.yaml
  - scorers/retrodmta.yaml
  # AiZynthFinder retrosynthesis, scored as an RL objective rather than the
  # heuristic SAScore.
  - scorers/synthesis-planner.yaml
  # Tool services: called by the agents between campaigns, not by the scorer
  # pipeline during one. They are here for the same reason the scorers are --
  # a Service name the ConfigMap and the tool env vars can dial.
  - tools/structure-prep.yaml
  - tools/annotation.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: dd-agentic
      app.kubernetes.io/managed-by: kustomize
    # Also label the pods, so `kubectl get pods`/`wait --for=delete` can select
    # the whole fleet. Selectors are deliberately left alone: a Deployment's
    # spec.selector is immutable once created.
    includeTemplates: true

images:
  - name: dd-agent
    newName: dd-agent
    newTag: local
  - name: boltz2-wrapper
    newName: boltz2-wrapper
    newTag: local
  - name: boltz-gateway
    newName: boltz-gateway
    newTag: local
  - name: reinvent-runner
    newName: reinvent-runner
    newTag: local
  - name: campaign-store
    newName: campaign-store
    newTag: local
  - name: posebusters
    newName: posebusters
    newTag: local
  - name: admet-predictor
    newName: admet-predictor
    newTag: local
  - name: retrodmta-predictor
    newName: retrodmta-predictor
    newTag: local
  - name: interaction-profiler
    newName: interaction-profiler
    newTag: local
  - name: synthesis-planner
    newName: synthesis-planner
    newTag: local
  - name: structure-prep
    newName: structure-prep
    newTag: local
  - name: annotation
    newName: annotation
    newTag: local
