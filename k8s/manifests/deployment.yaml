apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-agentic
  labels:
    app.kubernetes.io/name: dd-agentic
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    # Kept after the GPU moved to the runner: the agent mounts the ReadWriteOnce
    # claim, and a surge pod landing on another node could not attach it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dd-agentic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dd-agentic
        app.kubernetes.io/component: agent
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Creates the subPath layout the scorer Deployments mount, with
        # permissive modes. kubelet creates a missing subPath itself, but
        # root-owned and 0755, which the non-root interaction-profiler image
        # could not write to. The recursive chmod also repairs directories a
        # scorer pod reached first.
        - name: initialize-data
          image: dd-agent:local
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              mkdir -p \
                /data/shared \
                /data/ttps \
                /data/jobs \
                /data/logs \
                /data/tb-logs \
                /data/agent-logs \
                /data/boltz-cache \
                /data/aizynth-stock
              chmod -R 0777 /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: dd-agent
          image: dd-agent:local
          imagePullPolicy: IfNotPresent
          command:
            - sleep
            - infinity
          env:
            - name: REINVENT4_MCP_CONFIG
              value: /app/config/reinvent4_mcp_config.yaml
            - name: REINVENT4_AGENT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_BACKEND
            - name: REINVENT4_AGENT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_MODEL
            - name: REINVENT4_AGENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_BASE_URL
            - name: REINVENT4_AGENT_NO_VERIFY_SSL
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_NO_VERIFY_SSL
            - name: REINVENT4_AGENT_MULTI_AGENT
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_MULTI_AGENT
            - name: REINVENT4_AGENT_LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: REINVENT4_AGENT_LOG_DIR
            - name: REINVENT4_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-agentic-llm
                  key: REINVENT4_AGENT_API_KEY
            - name: SP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: SP_SERVICE_URL
            - name: ANNOTATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: ANNOTATION_SERVICE_URL
            - name: IP_SHARED_DIR
              valueFrom:
                configMapKeyRef:
                  name: dd-agentic-config
                  key: IP_SHARED_DIR
          resources:
            # No amd.com/gpu. REINVENT4 lives in dd-agentic-reinvent-runner
            # now, so this pod holds the agent and the MCP server only and is
            # freely schedulable -- which is what lets agent count and RL
            # capacity scale independently.
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /shared
              subPath: shared
            - name: data
              mountPath: /root/.reinvent4_mcp/ttps
              subPath: ttps
            - name: data
              mountPath: /data/reinvent4_mcp/jobs
              subPath: jobs
            - name: data
              mountPath: /data/reinvent4_mcp/logs
              subPath: logs
            - name: data
              mountPath: /data/reinvent4_mcp/tb_logs
              subPath: tb-logs
            - name: data
              mountPath: /logs
              subPath: agent-logs
            - name: agent-config
              mountPath: /app/config
              readOnly: true
            - name: agent-shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dd-agentic-data
        - name: agent-config
          configMap:
            name: dd-agentic-config
            items:
              - key: reinvent4_mcp_config.yaml
                path: reinvent4_mcp_config.yaml
        - name: agent-shm
          emptyDir:
            medium: Memory
            # Was 128Gi for REINVENT's dataloaders, which run in the runner now.
            sizeLimit: 2Gi
