# Overlay compose file for the structure-prep service.
# Usage: docker compose -f docker-compose.yml -f docker-compose.structure-prep.yml up

services:
  structure-prep:
    build:
      context: .
      dockerfile: services/structure-prep/Dockerfile
    image: structure-prep:latest
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
    environment:
      SP_SHARED_DIR: /shared
      SP_HOST: 0.0.0.0
      SP_PORT: "8080"
      SP_MAX_CONCURRENCY: "1"
    ports:
      - "127.0.0.1:8087:8080"
    healthcheck:
      test: ["CMD", "micromamba", "run", "-n", "base",
             "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reinvent4-mcp:
    environment:
      - SP_SERVICE_URL=http://structure-prep:8080
    depends_on:
      structure-prep:
        condition: service_healthy
