volumes:
  boltz_cache:

x-rocm-common: &rocm-common
  ipc: host
  tty: true
  # The AMD container runtime is not registered on every node's Docker daemon;
  # set DOCKER_GPU_RUNTIME=amd where it is (that runtime also honours
  # AMD_VISIBLE_DEVICES). Otherwise plain runc plus the ROCm device nodes,
  # with GPU selection done through HIP_VISIBLE_DEVICES.
  runtime: ${DOCKER_GPU_RUNTIME:-runc}
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - render
  security_opt:
    - seccomp=unconfined
  cap_add:
    - SYS_PTRACE

services:
  reinvent4-mcp:
    build:
      context: .
      dockerfile: services/dd-agent/Dockerfile
    # CPU only: REINVENT4 and the priors live in reinvent-runner now, so this
    # container needs no ROCm devices and no large shm. tty for the Rich UI.
    tty: true
    labels:
      - "slurm.job.id=${SLURM_JOB_ID:-}"
      - "slurm.user=${SLURM_JOB_USER:-$USER}"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
      - ${DATA_DIR:-./data}/ttps:/root/.reinvent4_mcp/ttps
      - ${DATA_DIR:-./data}/jobs:/data/reinvent4_mcp/jobs
      - ${DATA_DIR:-./data}/logs:/data/reinvent4_mcp/logs
      - ${DATA_DIR:-./data}/tb_logs:/data/reinvent4_mcp/tb_logs
      # dd-agent / dd-coscientist session logs + JSONL transcripts.
      - ${DATA_DIR:-./data}/agent_logs:/logs
    environment:
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY:-}
      # Used instead of LLM_GATEWAY_KEY for non-AMD endpoints (Azure, Anthropic).
      - REINVENT4_AGENT_API_KEY=${REINVENT4_AGENT_API_KEY:-}
      - REINVENT4_AGENT_BACKEND=${REINVENT4_AGENT_BACKEND:-anthropic}
      - REINVENT4_AGENT_MODEL=${REINVENT4_AGENT_MODEL:-claude-sonnet-4.6}
      - REINVENT4_AGENT_BASE_URL=${REINVENT4_AGENT_BASE_URL:-https://llm-api.amd.com/Anthropic}
      # OpenAI backend only: an api-version (or LLM_GATEWAY_KEY) selects the
      # Azure deployments endpoint <base-url>/openai/deployments/<model>.
      - REINVENT4_AGENT_API_VERSION=${REINVENT4_AGENT_API_VERSION:-}
      - REINVENT4_AGENT_NO_VERIFY_SSL=${REINVENT4_AGENT_NO_VERIFY_SSL:-true}
      - REINVENT4_AGENT_THINKING_BUDGET=${REINVENT4_AGENT_THINKING_BUDGET:-4096}
      - REINVENT4_AGENT_MAX_TOKENS=${REINVENT4_AGENT_MAX_TOKENS:-16384}
      - REINVENT4_AGENT_REASONING_EFFORT=${REINVENT4_AGENT_REASONING_EFFORT:-}
      - REINVENT4_AGENT_MULTI_AGENT=${REINVENT4_AGENT_MULTI_AGENT:-true}
      # Fixed to the /logs mount target inside the container (do NOT inherit
      # the host REINVENT4_AGENT_LOG_DIR, which is a host path).
      - REINVENT4_AGENT_LOG_DIR=/logs
      # Timestamp captured console logs. This service sets `tty: true` (needed
      # for the Rich UI), which allocates a PTY even when logs are captured, so
      # the wrapper's TTY autodetection can't tell. Set REINVENT4_AGENT_LOG_TIMESTAMPS=1
      # to force timestamps in `docker compose logs`; leave empty for a clean
      # interactive session.
      - REINVENT4_AGENT_LOG_TIMESTAMPS=${REINVENT4_AGENT_LOG_TIMESTAMPS:-}
      # Block 10 annotation cache/proxy.
      - ANNOTATION_SERVICE_URL=http://annotation:8080
      - SP_SERVICE_URL=http://structure-prep:8080
    # No extra_hosts: the gateway is reached directly by DNS. Nodes that
    # cannot resolve/reach it need the SSH tunnel, which is opt-in via
    # `-f docker-compose.yml -f docker-compose.tunnel.yml`.
    depends_on:
      reinvent-runner:
        condition: service_healthy
      boltz:
        condition: service_healthy
      posebusters:
        condition: service_healthy
      admet-predictor:
        condition: service_healthy
      retrodmta-predictor:
        condition: service_healthy
      interaction-profiler:
        condition: service_healthy
      synthesis-planner:
        condition: service_healthy
      annotation:
        condition: service_healthy
      structure-prep:
        condition: service_healthy

  # REINVENT4 lives here: RL/TL jobs, the in-process Scorer, the registries.
  # This is the half that needs the GPU; the agent above does not.
  reinvent-runner:
    build:
      context: .
      dockerfile: services/reinvent-runner/Dockerfile
    <<: *rocm-common
    shm_size: "128g"
    labels:
      - "slurm.job.id=${SLURM_JOB_ID:-}"
      - "slurm.user=${SLURM_JOB_USER:-$USER}"
      - "slurm.gpu=${REINVENT_GPU}"
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
      - ${DATA_DIR:-./data}/jobs:/data/reinvent4_mcp/jobs
      - ${DATA_DIR:-./data}/logs:/data/reinvent4_mcp/logs
      - ${DATA_DIR:-./data}/tb_logs:/data/reinvent4_mcp/tb_logs
      # Deliberately no ttps mount: TTPs are resolved agent-side and only the
      # mapped scorer_config crosses the wire.
    environment:
      - AMD_VISIBLE_DEVICES=${REINVENT_GPU}
      - HIP_VISIBLE_DEVICES=${REINVENT_GPU}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8086/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # First request imports torch and REINVENT4, which is slow.
      start_period: 180s

  boltz:
    build:
      context: .
      dockerfile: services/boltz2/Dockerfile
    <<: *rocm-common
    shm_size: "64g"
    labels:
      - "slurm.job.id=${SLURM_JOB_ID:-}"
      - "slurm.user=${SLURM_JOB_USER:-$USER}"
      - "slurm.gpu=${BOLTZ_GPU}"
    environment:
      - AMD_VISIBLE_DEVICES=${BOLTZ_GPU}
      - HIP_VISIBLE_DEVICES=${BOLTZ_GPU}
      # 0 enables boltz's optimized kernels; see k8s/scripts/ab-boltz-kernels.py
      - BOLTZ_NO_KERNELS=${BOLTZ_NO_KERNELS:-1}
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
      - boltz_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  structure-prep:
    build:
      context: .
      dockerfile: services/structure-prep/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8080"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
    environment:
      - SP_SHARED_DIR=/shared
      - SP_HOST=0.0.0.0
      - SP_PORT=8080
      - SP_MAX_CONCURRENCY=1
    healthcheck:
      test: ["CMD", "micromamba", "run", "-n", "base",
             "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  posebusters:
    build: ./services/posebusters
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  admet-predictor:
    build:
      context: .
      dockerfile: services/admet-predictor/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"

  retrodmta-predictor:
    build:
      context: .
      dockerfile: services/retrodmta-predictor/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"

  interaction-profiler:
    build:
      context: .
      dockerfile: services/interaction-profiler/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
    environment:
      - ANNOTATION_SERVICE_URL=http://annotation:8080
    depends_on:
      annotation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  synthesis-planner:
    build:
      context: .
      dockerfile: services/synthesis-planner/Dockerfile
    ports:
      # Host 8089, not 8086: reinvent-runner publishes 8086. Only the host side
      # moves -- in-compose callers still reach it on 8086 via service DNS,
      # which is what scoring.synthesis_planner.service_url points at.
      - "127.0.0.1:8089:8086"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
      - ${AIZYNB_STOCK_DIR:-/data/aizynthfinder/stock}:/app/models/stock:ro
      - ${DATA_DIR:-./data}/synthesis_cache:/cache
    environment:
      - PLANNER_MAX_CONCURRENCY=${PLANNER_MAX_CONCURRENCY:-2}
      - SYNC_BATCH_LIMIT=${SYNC_BATCH_LIMIT:-5}
    healthcheck:
      test: ["CMD-SHELL", "/opt/conda/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8086/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  annotation:
    build:
      context: services/annotation
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ${DATA_DIR:-./data}/shared:/shared
    environment:
      - ANNOTATION_CACHE_DIR=/shared/annotations
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s