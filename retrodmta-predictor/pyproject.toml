[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrodmta-predictor"
version = "1.0.0"
description = "Per-target, per-temporal-window RetroDMTA project-endpoint prediction (XGBoost + Chemprop-MTL + CheMeleon-MTL) with ensemble/single-method selection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy==1.26.4",
    "rdkit==2024.3.1",
    "xgboost==3.3.0",
    "pandas>=2.0,<2.3",
    "chemprop==2.2.4",
    "dimorphite-dl==2.0.2",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
]

[project.scripts]
retrodmta-predict = "retrodmta_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrodmta_predictor"]

# Model weights live centrally in dd_agentic/models/ (gitignored) and are baked into the
# image by the Dockerfile; they are not part of this package/wheel.
