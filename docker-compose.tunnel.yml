# Overlay for nodes that cannot reach the LLM gateway directly and go
# through the SSH reverse tunnel described in LLM_GATEWAY_TUNNEL.md.
#
#   LLM_GATEWAY_HOST=<gateway-host> docker compose \
#       -f docker-compose.yml -f docker-compose.tunnel.yml \
#       run --rm reinvent4-mcp
#
# It points the gateway hostname at the Docker host, where the relay is
# listening, so TLS still validates against the real certificate. The
# tunnel port belongs in the URL, e.g.
#   REINVENT4_AGENT_BASE_URL=https://<gateway-host>:9579/Anthropic
#
# Do NOT apply this overlay when the node reaches the gateway directly:
# the hostname would resolve to the Docker host, where nothing serves
# port 443, and every request would fail with "connection refused".
services:
  reinvent4-mcp:
    extra_hosts:
      - "${LLM_GATEWAY_HOST:?set LLM_GATEWAY_HOST to the gateway hostname}:host-gateway"
